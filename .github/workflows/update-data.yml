name: Update postal-code data

on:
  schedule:
    # 1st of every month, 04:17 UTC. Offset to avoid the top-of-hour stampede.
    - cron: '17 4 1 * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm if data changed'
        required: false
        default: 'true'

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write
  # Lets the runner mint the OIDC token that npm trusted publishing exchanges
  # for a short-lived publish credential.
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      # setup-node seeds the generated .npmrc with `_authToken=${NODE_AUTH_TOKEN}`.
      # npm only falls back to OIDC when it finds no token configured, so that
      # line has to go or publishing attempts legacy auth and fails.
      - name: Drop token auth from .npmrc
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi

      - run: npm ci

      - name: Download + rebuild indexes
        run: npm run update-data

      - name: Typecheck + build
        run: |
          npm run typecheck
          npm run build

      - name: Smoke test
        run: npm test

      - name: Detect data changes
        id: changes
        run: |
          if git diff --quiet -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Data changed."
          fi

      # Nothing here can prove the npm-side trusted-publisher registration is
      # right, but it catches the two local ways OIDC silently breaks, before
      # the version bump creates a release commit for a publish that can't run.
      - name: Check publish prerequisites
        if: steps.changes.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.publish == 'true')
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::No OIDC token available. The job needs 'permissions: id-token: write' and a GitHub-hosted runner."
            exit 1
          fi
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $npm_version predates 11.5.1 and cannot publish over OIDC. Raise the Node version."
            exit 1
          fi
          echo "npm $npm_version, OIDC available."

      - name: Commit, bump version, tag
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: refresh from GeoNames ($(date -u +%Y-%m-%d))"
          npm version patch -m "release: %s (data refresh)"

      - name: Publish to npm
        if: steps.changes.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.publish == 'true')
        run: npm publish --access public

      # Runs only if every preceding step succeeded, so a failed publish leaves
      # the bump and tag local to the runner instead of on the remote.
      - name: Push commit and tag
        if: steps.changes.outputs.changed == 'true'
        run: git push --follow-tags
