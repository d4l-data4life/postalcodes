name: Update postal-code data

on:
  schedule:
    # 1st of every month, 04:17 UTC. Offset to avoid the top-of-hour stampede.
    - cron: '17 4 1 * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm if data changed'
        required: false
        default: 'true'

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - run: npm ci

      - name: Download + rebuild indexes
        run: npm run update-data

      - name: Typecheck + build
        run: |
          npm run typecheck
          npm run build

      - name: Smoke test
        run: npm test

      - name: Detect data changes
        id: changes
        run: |
          if git diff --quiet -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Data changed."
          fi

      - name: Commit, bump version, tag
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: refresh from GeoNames ($(date -u +%Y-%m-%d))"
          npm version patch -m "release: %s (data refresh)"
          git push --follow-tags

      - name: Publish to npm
        if: steps.changes.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.publish == 'true')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
